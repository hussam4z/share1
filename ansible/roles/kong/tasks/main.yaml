- name: Create Kong namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ kong_namespace }}"
    state: present

- name: Add Kong Helm repository
  community.kubernetes.helm_repository:
    name: kong
    repo_url: https://charts.konghq.com

- name: Install Kong via Helm
  community.kubernetes.helm:
    name: kong
    chart_ref: kong/kong
    release_namespace: "{{ kong_namespace }}"
    create_namespace: false
    values:
      ingressController:
        enabled: true
